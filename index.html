<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Arcline — Design Intelligence for Teams That Ship</title>
    <meta name="description" content="Arcline helps product teams govern, scale, and accelerate their design systems." />
    
    <!-- SEO & Social -->
    <link rel="canonical" href="{{SITE_URL}}" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{SITE_URL}}" />
    <meta property="og:title" content="Arcline — Design Intelligence for Teams That Ship" />
    <meta property="og:description" content="Govern, scale, and accelerate your design system." />
    <meta property="og:image" content="{{SITE_URL}}/og-image.png" />
    
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="{{SITE_URL}}" />
    <meta name="twitter:title" content="Arcline — Design Intelligence for Teams That Ship" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: 'Inter', sans-serif; }
      html { background-color: #fafafa; color: #1a1a2e; }
      html.dark { background-color: #0f0f14; color: #f5f5f7; }
    </style>
    <script>
      (function() {
        const stored = localStorage.getItem('theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        const theme = stored || (prefersDark ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
